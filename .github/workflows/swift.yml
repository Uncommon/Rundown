name: CI

on:
  push:
    branches: [ "main" ]
    tags: ["v*"]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Swift ${{ matrix.swift }} / SwiftSyntax ${{ matrix.syntax }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2"
            runner: macos-15
            xcode: "26.0.1"
            syntax: "602.0.0"
            discovery: false
          - swift: "6.2"
            runner: macos-15
            xcode: "26.0.1"
            syntax: "604.0.0"
            discovery: false
          - swift: "6.3"
            runner: macos-26
            xcode: "26.6"
            syntax: "603.0.2"
            discovery: false
          - swift: "6.4"
            runner: xcode-27
            xcode: "27.2"
            syntax: "604.0.0"
            discovery: true

    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve SwiftSyntax version
        env:
          SWIFT_SYNTAX_VERSION: ${{ matrix.syntax }}
        run: |
          for package in . Tests/InvalidSequencesFixture Tests/PlatformSmokeFixture; do
            swift package --package-path "$package" resolve swift-syntax --version "$SWIFT_SYNTAX_VERSION"
          done

      - name: Resolve downstream discovery dependencies
        if: matrix.discovery
        env:
          SWIFT_SYNTAX_VERSION: ${{ matrix.syntax }}
        run: swift package --package-path Tests/ExternalSpecFixture resolve swift-syntax --version "$SWIFT_SYNTAX_VERSION"

      - name: Run package tests
        run: swift test

      - name: Test downstream adapters
        run: swift test --package-path Tests/PlatformSmokeFixture

      - name: Test downstream discovery
        if: matrix.discovery
        run: swift test --package-path Tests/ExternalSpecFixture

  platform-smoke:
    name: Platform smoke (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: watchOS
            destination: generic/platform=watchOS Simulator
          - platform: Mac Catalyst
            destination: generic/platform=macOS,variant=Mac Catalyst

    defaults:
      run:
        working-directory: Tests/PlatformSmokeFixture

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build consumer tests
        run: |
          xcodebuild -quiet \
            -scheme PlatformSmokeFixture-Package \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/RundownPlatformSmoke" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
